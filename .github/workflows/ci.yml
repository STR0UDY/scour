name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Scour.slnx

      - name: Build
        run: dotnet build Scour.slnx -c Release --no-restore

      # Schema, unique ids, env-var-rooted paths, detect present: one bad rule fails the build.
      - name: Lint rules
        run: dotnet run --project src/Scour.Cli -c Release --no-build -- rules lint rules

      - name: Test
        run: dotnet test Scour.slnx -c Release --no-build --logger "trx" --results-directory TestResults

      # A rule that suddenly matches far more than expected shows up here before it ships.
      - name: Scan snapshot (read-only)
        run: dotnet run --project src/Scour.Cli -c Release --no-build -- scan --all --json > scan.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            TestResults
            scan.json
