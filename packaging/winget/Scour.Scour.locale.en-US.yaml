ShortDescription: A free, open-source Windows cleaner that never deletes anything you haven't seen first.
Description: |-
  Scour reclaims disk space from temp files, caches and logs, shows where your space went with a
  fast treemap, tidies what starts with Windows and uninstalls apps along with their leftovers.
  No telemetry, no ads, no account and no background service. Every cleanable location is an
  auditable JSON rule, and every clean is a preview first.
